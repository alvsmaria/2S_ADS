<!doctype html>
<html>
    <head>
        <title>Atividade 02 - HTML</title>
    </head>
    <body>
        <h1><font color="red">Contato</font></h1>
        <i>Seja bem vindo! Preencha o <b>formulário</b> abaixo para:</i>
        <ul>
            <li>dúvidas</li>
            <li>sugestões</li>
            <li>críticas</li>
            <li>orçamentos</li>
        </ul>
        Caso queira ver nossos produtos, clique
        <a href="#">aqui</a>
        <br><br>
        <form>
            nome: <input type="text" id="nome" placeholder="digite seu nome completo" required><br>
            e-mail: <input type="email" id="e-mail" placeholder="informe um e-mail válido" required><br>
            telefone: <input type="text" id="telefone" placeholder="(xx) xxxxx-xxxx" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" required><br>
            assunto: <select id="assunto">
                <option>Dúvidas</option>
                <option>Sugestões</option>
                <option>Críticas</option>
                <option>Orçamentos</option>
            </select><br>
            Deseja receber uma cópia deste e-mail: 
            <input type="radio" id="sim" name="opção">Sim
            <input type="radio" id="não" name="opção">Não
            <br><br>
            mensagem: <textarea id="mensagem" rows="3" cols="30" placeholder="digite sua mensagem"></textarea>
            <br><br>
            <button type="submit" id="botão">Enviar</button>
        </form>
    </body>
</html>
